<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flappin' Off</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1020;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    #wrap { position: fixed; inset: 0; }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      box-sizing: border-box;
      padding-top: calc(12px + env(safe-area-inset-top));
      padding-right: calc(12px + env(safe-area-inset-right));
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      padding-left: calc(12px + env(safe-area-inset-left));
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .chip {
      background: rgba(0,0,0,0.35);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 13px;
      backdrop-filter: blur(6px);
      max-width: calc(50vw - 18px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .center { display: grid; place-items: center; }

    .panel {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 16px 18px;
      width: min(520px, calc(100vw - 24px));
      color: #fff;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      text-align: center;
      box-sizing: border-box;
    }

    .title { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
    .sub { font-size: 14px; margin: 0; opacity: 0.92; line-height: 1.4; }
    .hint { margin-top: 10px; font-size: 13px; opacity: 0.9; }

    .footer { display: flex; justify-content: center; }
    .tiny { font-size: 12px; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" aria-label="Flappin' Off game"></canvas>
  </div>

  <div class="hud" aria-hidden="true">
    <div class="topbar">
      <div class="chip">Score: <span id="score">0</span></div>
      <div class="chip">Best: <span id="best">0</span></div>
    </div>

    <div class="center">
      <div id="panel" class="panel" style="display:none;">
        <p class="title" id="panelTitle">Flappin' Off</p>
        <p class="sub" id="panelText">Tap to hop on phones and tablets. Press Space to jump on computers.</p>
        <div class="hint" id="panelHint">Tap or press Space to start.</div>
      </div>
    </div>

    <div class="footer">
      <div class="chip tiny">Controls: Tap or Space. Press R to restart.</div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d", { alpha: false });

      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const panel = document.getElementById("panel");
      const panelTitle = document.getElementById("panelTitle");
      const panelText = document.getElementById("panelText");
      const panelHint = document.getElementById("panelHint");

      const STORAGE_KEY = "flappin_off_best_v1";

      const state = {
        dpr: 1,
        w: 0,
        h: 0,
        tPrev: 0,
        started: false,
        dead: false,
        showPanel: true,
        screenShake: 0
      };

      const cfg = {
        gravity: 1500,
        flapVel: -560,
        maxFall: 950,
        groundH: 92,
        pipeW: 80,
        pipeGap: 220,
        pipeSpacing: 360,
        pipeSpeed: 255,
        ceilingPad: 64,
        floorPad: 50,
        birdR: 16
      };

      const bird = {
        x: 0,
        y: 0,
        vy: 0,
        rot: 0
      };

      let score = 0;
      let best = 0;

      const pipes = [];
      const clouds = [];

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function loadBest() {
        const v = Number(localStorage.getItem(STORAGE_KEY));
        best = Number.isFinite(v) ? v : 0;
        bestEl.textContent = String(best);
      }

      function saveBest() {
        try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (_) {}
      }

      function setCanvasSize() {
        state.dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        const cssW = Math.floor(window.innerWidth);
        const cssH = Math.floor(window.innerHeight);

        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
        canvas.width = Math.floor(cssW * state.dpr);
        canvas.height = Math.floor(cssH * state.dpr);

        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        state.w = cssW;
        state.h = cssH;

        if (state.w < 520) {
          cfg.pipeSpacing = 260;
          cfg.pipeW = 60;
          bird.x = Math.floor(state.w * 0.18);
        } else {
          cfg.pipeSpacing = 360;
          cfg.pipeW = 80;
          bird.x = Math.floor(state.w * 0.28);
        }
      }

      function groundY() {
        return state.h - cfg.groundH;
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function makePipe(x) {
        const gY = groundY();
        const minTop = cfg.ceilingPad;
        const maxTop = Math.max(minTop + 60, gY - cfg.floorPad - cfg.pipeGap - 60);
        const topH = Math.floor(rand(minTop, maxTop));
        return {
          x,
          topH,
          passed: false
        };
      }

      function seedPipes() {
        pipes.length = 0;
        const startX = state.w + 160;
        for (let i = 0; i < 4; i++) pipes.push(makePipe(startX + i * cfg.pipeSpacing));
      }

      function makeCloud() {
        return {
          x: rand(-200, state.w + 200),
          y: rand(40, Math.max(80, state.h * 0.35)),
          s: rand(0.7, 1.4),
          v: rand(10, 26)
        };
      }

      function seedClouds() {
        clouds.length = 0;
        for (let i = 0; i < 7; i++) clouds.push(makeCloud());
      }

      function showStartPanel() {
        panelTitle.textContent = "Flappin' Off";
        panelText.textContent = "Tap to hop on phones and tablets. Press Space to jump on computers.";
        panelHint.textContent = "Tap or press Space to start.";
        panel.style.display = "block";
        state.showPanel = true;
      }

      function showGameOverPanel() {
        panelTitle.textContent = "Game Over";
        panelText.textContent = "Score: " + score + "   Best: " + best;
        panelHint.textContent = "Tap or press Space to play again. Press R to restart.";
        panel.style.display = "block";
        state.showPanel = true;
      }

      function hidePanel() {
        panel.style.display = "none";
        state.showPanel = false;
      }

      function resetGame() {
        score = 0;
        scoreEl.textContent = "0";

        bird.y = Math.floor(state.h * 0.45);
        bird.vy = 0;
        bird.rot = 0;

        state.started = false;
        state.dead = false;
        state.screenShake = 0;

        seedPipes();
        seedClouds();

        showStartPanel();
      }

      function endGame() {
        if (state.dead) return;
        state.dead = true;

        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          saveBest();
        }

        state.screenShake = 0.18;
        showGameOverPanel();
      }

      function flap() {
        if (state.dead) {
          resetGame();
          return;
        }
        if (!state.started) {
          state.started = true;
          hidePanel();
        }
        bird.vy = cfg.flapVel;
      }

      function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
        const closestX = clamp(cx, rx, rx + rw);
        const closestY = clamp(cy, ry, ry + rh);
        const dx = cx - closestX;
        const dy = cy - closestY;
        return dx * dx + dy * dy <= r * r;
      }

      function update(dt) {
        const gY = groundY();

        for (const c of clouds) {
          c.x -= c.v * dt;
          if (c.x < -260) {
            c.x = state.w + 260;
            c.y = rand(40, Math.max(80, state.h * 0.35));
            c.s = rand(0.7, 1.4);
            c.v = rand(10, 26);
          }
        }

        if (!state.started && !state.dead) {
          bird.y = Math.floor(state.h * 0.45) + Math.sin(performance.now() / 180) * 6;
          bird.rot = -0.12;
          return;
        }

        if (state.dead) {
          bird.vy = Math.min(cfg.maxFall, bird.vy + cfg.gravity * dt);
          bird.y += bird.vy * dt;
          bird.rot = clamp(bird.rot + 2.2 * dt, -0.7, 1.25);
          if (bird.y + cfg.birdR > gY) {
            bird.y = gY - cfg.birdR;
            bird.vy = 0;
          }
          return;
        }

        bird.vy = Math.min(cfg.maxFall, bird.vy + cfg.gravity * dt);
        bird.y += bird.vy * dt;

        const targetRot = clamp(bird.vy / 900, -0.55, 1.05);
        bird.rot += (targetRot - bird.rot) * Math.min(1, dt * 10);

        for (const p of pipes) {
          p.x -= cfg.pipeSpeed * dt;
          if (!p.passed && p.x + cfg.pipeW < bird.x - cfg.birdR) {
            p.passed = true;
            score += 1;
            scoreEl.textContent = String(score);
          }
        }

        if (pipes.length && pipes[0].x + cfg.pipeW < -100) {
          pipes.shift();
          const newX = pipes[pipes.length - 1].x + cfg.pipeSpacing;
          pipes.push(makePipe(newX));
        }

        if (bird.y - cfg.birdR < 0) {
          bird.y = cfg.birdR;
          bird.vy = 0;
        }
        if (bird.y + cfg.birdR >= gY) {
          bird.y = gY - cfg.birdR;
          endGame();
          return;
        }

        for (const p of pipes) {
          const topRect = { x: p.x, y: 0, w: cfg.pipeW, h: p.topH };
          const bottomY = p.topH + cfg.pipeGap;
          const botRect = { x: p.x, y: bottomY, w: cfg.pipeW, h: gY - bottomY };

          if (circleRectCollide(bird.x, bird.y, cfg.birdR, topRect.x, topRect.y, topRect.w, topRect.h)) {
            endGame();
            return;
          }
          if (circleRectCollide(bird.x, bird.y, cfg.birdR, botRect.x, botRect.y, botRect.w, botRect.h)) {
            endGame();
            return;
          }
        }

        state.screenShake = Math.max(0, state.screenShake - dt);
      }

      function drawBackground() {
        const w = state.w;
        const h = state.h;

        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, "#7cc7ff");
        grad.addColorStop(0.55, "#bde6ff");
        grad.addColorStop(1, "#e9fbff");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        ctx.globalAlpha = 0.18;
        ctx.fillStyle = "#ffffff";
        for (const c of clouds) {
          const x = c.x;
          const y = c.y;
          const s = c.s;

          ctx.beginPath();
          ctx.ellipse(x, y, 60 * s, 20 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(x + 44 * s, y + 6 * s, 72 * s, 24 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(x - 46 * s, y + 10 * s, 54 * s, 18 * s, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawPipe(p) {
        const gY = groundY();
        const x = p.x;
        const w = cfg.pipeW;

        const topH = p.topH;
        const gapBottomY = topH + cfg.pipeGap;

        const pipeGrad = ctx.createLinearGradient(x, 0, x + w, 0);
        pipeGrad.addColorStop(0, "#2aa84a");
        pipeGrad.addColorStop(0.5, "#3ddc67");
        pipeGrad.addColorStop(1, "#1f7f38");

        ctx.fillStyle = pipeGrad;
        ctx.fillRect(x, 0, w, topH);
        ctx.fillRect(x, gapBottomY, w, gY - gapBottomY);

        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.fillRect(x, 0, 8, topH);
        ctx.fillRect(x, gapBottomY, 8, gY - gapBottomY);

        const capH = 18;
        ctx.fillStyle = "#1f7f38";
        ctx.fillRect(x - 4, topH - capH, w + 8, capH);
        ctx.fillRect(x - 4, gapBottomY, w + 8, capH);

        ctx.strokeStyle = "rgba(0,0,0,0.22)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, 0, w, topH);
        ctx.strokeRect(x, gapBottomY, w, gY - gapBottomY);
      }

      function drawGround() {
        const w = state.w;
        const gY = groundY();

        ctx.fillStyle = "#3d2c1b";
        ctx.fillRect(0, gY, w, cfg.groundH);

        ctx.fillStyle = "#4c3a24";
        for (let x = 0; x < w; x += 28) ctx.fillRect(x, gY + 8, 14, 10);
      }

      function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rot);

        ctx.fillStyle = "#ffdf3b";
        ctx.strokeStyle = "rgba(0,0,0,0.25)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(0, 0, cfg.birdR, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(6, -6, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#1a1a1a";
        ctx.beginPath();
        ctx.arc(8, -6, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff8a2b";
        ctx.beginPath();
        ctx.moveTo(cfg.birdR - 2, 0);
        ctx.lineTo(cfg.birdR + 16, 6);
        ctx.lineTo(cfg.birdR + 16, -6);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#ffb36b";
        ctx.beginPath();
        ctx.moveTo(cfg.birdR - 2, 0);
        ctx.lineTo(cfg.birdR + 10, 4);
        ctx.lineTo(cfg.birdR + 10, -4);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function draw() {
        const w = state.w;
        const h = state.h;

        let shakeX = 0;
        let shakeY = 0;
        if (state.screenShake > 0) {
          const mag = 6 * (state.screenShake / 0.18);
          shakeX = (Math.random() * 2 - 1) * mag;
          shakeY = (Math.random() * 2 - 1) * mag;
        }

        ctx.save();
        ctx.clearRect(0, 0, w, h);
        ctx.translate(shakeX, shakeY);

        drawBackground();

        for (const p of pipes) drawPipe(p);

        drawGround();
        drawBird();

        if (!state.started && !state.dead) {
          ctx.fillStyle = "rgba(0,0,0,0.10)";
          ctx.fillRect(-shakeX, -shakeY, w, h);
        }

        ctx.restore();
      }

      function loop(ts) {
        if (!state.tPrev) state.tPrev = ts;
        const dt = Math.min(0.033, (ts - state.tPrev) / 1000);
        state.tPrev = ts;

        update(dt);
        draw();

        requestAnimationFrame(loop);
      }

      function onPointerDown(e) {
        e.preventDefault();
        flap();
      }

      function onKeyDown(e) {
        if (e.code === "Space") {
          e.preventDefault();
          flap();
          return;
        }
        if (e.code === "KeyR") {
          e.preventDefault();
          resetGame();
        }
      }

      function onResize() {
        setCanvasSize();
        resetGame();
      }

      window.addEventListener("resize", onResize);
      canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
      window.addEventListener("keydown", onKeyDown);

      setCanvasSize();
      loadBest();
      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
