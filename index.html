<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flappin' Off</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #0b1020; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
    canvas { width: 100vw; height: 100vh; display: block; touch-action: manipulation; }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      box-sizing: border-box;
      padding-top: calc(12px + env(safe-area-inset-top));
      padding-right: calc(12px + env(safe-area-inset-right));
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      padding-left: calc(12px + env(safe-area-inset-left));
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .chip {
      background: rgba(0,0,0,0.35);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 13px;
      backdrop-filter: blur(6px);
      max-width: calc(50vw - 18px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .center { display: grid; place-items: center; }

    .panel {
      pointer-events: none;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 16px 18px;
      width: min(520px, calc(100vw - 24px));
      color: #fff;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      text-align: center;
      box-sizing: border-box;
    }

    .title { font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: 0.2px; }
    .sub { font-size: 14px; margin: 0; opacity: 0.9; line-height: 1.4; }
    .hint { margin-top: 10px; font-size: 13px; opacity: 0.9; }

    .footer { display: flex; justify-content: center; }
    .tiny { font-size: 12px; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" aria-label="Flappy Bird game"></canvas>
  </div>

  <div class="hud" aria-hidden="true">
    <div class="topbar">
      <div class="chip">Score: <span id="score">0</span></div>
      <div class="chip">Best: <span id="best">0</span></div>
    </div>

    <div class="center">
      <div id="panel" class="panel" style="display:none;">
        <p class="title" id="panelTitle">Flappy Bird</p>
        <p class="sub" id="panelText">Tap to hop on phones and tablets. Press Space to jump on computers.</p>
        <div class="hint" id="panelHint">Tap or press Space to start.</div>
      </div>
    </div>

    <div class="footer">
      <div class="chip tiny">Controls: Tap or Space. Press R to restart.</div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d", { alpha: false });

      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const panel = document.getElementById("panel");
      const panelTitle = document.getElementById("panelTitle");
      const panelText = document.getElementById("panelText");
      const panelHint = document.getElementById("panelHint");

      const STORAGE_KEY = "flappy_best_v2";

      const state = {
        tPrev: 0,
        running: false,
        started: false,
        gameOver: false,
        pausedForVisibility: false,
      };

      const world = {
        gravity: 1650,       // easier than before
        flapVel: -650,       // slightly gentler jump
        maxFall: 900,

        pipeGap: 210,        // bigger gap = easier
        pipeWidth: 78,
        pipeSpacing: 360,    // more distance between pipes = easier
        pipeSpeed: 255,      // slightly slower = easier

        groundHeight: 90,
      };

      const bird = {
        x: 0,
        y: 0,
        r: 16,
        vy: 0,
        rot: 0,
      };

      let pipes = [];
      let score = 0;
      let best = 0;

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function setCanvasSize() {
        const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

        const cssW = Math.floor(window.innerWidth);
        const cssH = Math.floor(window.innerHeight);

        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";

        canvas.width = Math.floor(cssW * dpr);
        canvas.height = Math.floor(cssH * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        bird.x = Math.floor(cssW * 0.28);
        if (!state.started && !state.gameOver) bird.y = Math.floor(cssH * 0.45);
      }

      function loadBest() {
        const v = Number(localStorage.getItem(STORAGE_KEY));
        best = Number.isFinite(v) ? v : 0;
        bestEl.textContent = String(best);
      }

      function saveBest() {
        try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (_) {}
      }

      function makePipe(x) {
        const hCss = window.innerHeight;
        const ceiling = 70;
        const floorPad = world.groundHeight + 50;

        const usable = Math.max(140, hCss - ceiling - floorPad);

        const gap = clamp(world.pipeGap, 160, 260);
        const center = ceiling + (Math.random() * (usable - gap) + gap / 2);

        const topH = Math.floor(center - gap / 2);
        const bottomY = Math.floor(center + gap / 2);

        return { x, w: world.pipeWidth, topH, bottomY, passed: false };
      }

      function resetGame(showStartPanel = true) {
        score = 0;
        scoreEl.textContent = "0";

        bird.vy = 0;
        bird.rot = 0;
        bird.y = Math.floor(window.innerHeight * 0.45);

        pipes = [];
        const startX = window.innerWidth + 140;
        for (let i = 0; i < 4; i++) {
          pipes.push(makePipe(startX + i * world.pipeSpacing));
        }

        state.running = true;
        state.started = false;
        state.gameOver = false;
        state.tPrev = 0;

        if (showStartPanel) {
          panelTitle.textContent = "Flappy Bird";
          panelText.textContent = "Tap to hop on phones and tablets. Press Space to jump on computers.";
          panelHint.textContent = "Tap or press Space to start.";
          panel.style.display = "block";
        } else {
          panel.style.display = "none";
        }
      }

      function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
        const closestX = clamp(cx, rx, rx + rw);
        const closestY = clamp(cy, ry, ry + rh);
        const dx = cx - closestX;
        const dy = cy - closestY;
        return (dx * dx + dy * dy) <= (r * r);
      }

      function endGame() {
        state.gameOver = true;
        state.started = false;

        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          saveBest();
        }

        panelTitle.textContent = "Game Over";
        panelText.textContent = "Score: " + score + "   Best: " + best;
        panelHint.textContent = "Tap or press Space to play again. Press R to restart.";
        panel.style.display = "block";
      }

      function flap() {
        if (!state.running) return;

        if (state.gameOver) {
          resetGame(true);
          return;
        }

        if (!state.started) {
          state.started = true;
          panel.style.display = "none";
        }

        bird.vy = world.flapVel;
      }

      function restart() {
        resetGame(true);
      }

      function update(dt) {
        if (!state.running) return;

        const wCss = window.innerWidth;
        const hCss = window.innerHeight;
        const groundY = hCss - world.groundHeight;

        if (!state.started && !state.gameOver) {
          bird.y += Math.sin(performance.now() / 180) * 0.25;
          bird.rot = -0.08;
          return;
        }

        if (state.gameOver) {
          bird.vy = Math.min(world.maxFall, bird.vy + world.gravity * dt);
          bird.y += bird.vy * dt;
          bird.rot = clamp(bird.rot + 1.7 * dt, -0.7, 1.2);
          if (bird.y + bird.r > groundY) {
            bird.y = groundY - bird.r;
            bird.vy = 0;
          }
          return;
        }

        bird.vy = Math.min(world.maxFall, bird.vy + world.gravity * dt);
        bird.y += bird.vy * dt;

        const targetRot = clamp(bird.vy / 900, -0.55, 1.05);
        bird.rot += (targetRot - bird.rot) * Math.min(1, dt * 8);

        for (const p of pipes) {
          p.x -= world.pipeSpeed * dt;

          const pipeRight = p.x + p.w;
          if (!p.passed && pipeRight < bird.x - bird.r) {
            p.passed = true;
            score += 1;
            scoreEl.textContent = String(score);
          }
        }

        for (let i = 0; i < pipes.length; i++) {
          if (pipes[i].x + pipes[i].w < -80) {
            const newX = Math.max(...pipes.map(p => p.x)) + world.pipeSpacing;
            pipes[i] = makePipe(newX);
          }
        }

        if (bird.y - bird.r < 0) {
          bird.y = bird.r;
          bird.vy = 0;
        }

        if (bird.y + bird.r > groundY) {
          bird.y = groundY - bird.r;
          endGame();
          return;
        }

        for (const p of pipes) {
          const rx = p.x;
          const rw = p.w;

          const topRect = { x: rx, y: 0, w: rw, h: p.topH };
          const botRect = { x: rx, y: p.bottomY, w: rw, h: groundY - p.bottomY };

          if (circleRectCollide(bird.x, bird.y, bird.r, topRect.x, topRect.y, topRect.w, topRect.h)) {
            endGame();
            return;
          }
          if (circleRectCollide(bird.x, bird.y, bird.r, botRect.x, botRect.y, botRect.w, botRect.h)) {
            endGame();
            return;
          }
        }
      }

      function drawPipe(p, groundY) {
        const x = p.x;
        const w = p.w;

        const topH = p.topH;
        const botY = p.bottomY;
        const botH = groundY - botY;

        const pipeGrad = ctx.createLinearGradient(x, 0, x + w, 0);
        pipeGrad.addColorStop(0, "#2aa84a");
        pipeGrad.addColorStop(0.5, "#3ddc67");
        pipeGrad.addColorStop(1, "#1f7f38");

        ctx.fillStyle = pipeGrad;
        ctx.fillRect(x, 0, w, topH);
        ctx.fillRect(x, botY, w, botH);

        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.fillRect(x, 0, 8, topH);
        ctx.fillRect(x, botY, 8, botH);

        const capH = 18;
        ctx.fillStyle = "#1f7f38";
        ctx.fillRect(x - 4, topH - capH, w + 8, capH);
        ctx.fillRect(x - 4, botY, w + 8, capH);

        ctx.strokeStyle = "rgba(0,0,0,0.22)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, 0, w, topH);
        ctx.strokeRect(x, botY, w, botH);
      }

      function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rot);

        ctx.fillStyle = "#ffdf3b";
        ctx.strokeStyle = "rgba(0,0,0,0.25)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(6, -6, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#1a1a1a";
        ctx.beginPath();
        ctx.arc(8, -6, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff8a2b";
        ctx.beginPath();
        ctx.moveTo(bird.r - 2, 0);
        ctx.lineTo(bird.r + 16, 6);
        ctx.lineTo(bird.r + 16, -6);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#ffb36b";
        ctx.beginPath();
        ctx.moveTo(bird.r - 2, 0);
        ctx.lineTo(bird.r + 10, 4);
        ctx.lineTo(bird.r + 10, -4);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function draw() {
        const wCss = window.innerWidth;
        const hCss = window.innerHeight;
        const groundY = hCss - world.groundHeight;

        ctx.clearRect(0, 0, wCss, hCss);

        const grad = ctx.createLinearGradient(0, 0, 0, hCss);
        grad.addColorStop(0, "#7cc7ff");
        grad.addColorStop(0.55, "#bde6ff");
        grad.addColorStop(1, "#e9fbff");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, wCss, hCss);

        ctx.globalAlpha = 0.18;
        ctx.fillStyle = "#ffffff";
        const t = performance.now() / 1000;
        for (let i = 0; i < 6; i++) {
          const cx = (t * 18 + i * 220) % (wCss + 240) - 120;
          const cy = 80 + (i % 3) * 46;
          ctx.beginPath();
          ctx.ellipse(cx, cy, 55, 18, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(cx + 40, cy + 6, 65, 22, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const p of pipes) drawPipe(p, groundY);

        ctx.fillStyle = "#3d2c1b";
        ctx.fillRect(0, groundY, wCss, world.groundHeight);
        ctx.fillStyle = "#4c3a24";
        for (let x = 0; x < wCss; x += 28) ctx.fillRect(x, groundY + 8, 14, 10);

        drawBird();

        if (!state.started && !state.gameOver) {
          ctx.fillStyle = "rgba(0,0,0,0.12)";
          ctx.fillRect(0, 0, wCss, hCss);
        }
      }

      function loop(ts) {
        if (!state.running) return;

        if (!state.tPrev) state.tPrev = ts;
        const dt = Math.min(0.033, (ts - state.tPrev) / 1000);
        state.tPrev = ts;

        update(dt);
        draw();

        requestAnimationFrame(loop);
      }

      function onPointerDown(e) {
        e.preventDefault();
        flap();
      }

      function onKeyDown(e) {
        if (e.code === "Space") {
          e.preventDefault();
          flap();
          return;
        }
        if (e.code === "KeyR") {
          e.preventDefault();
          restart();
        }
      }

      function onVisibility() {
        if (document.hidden) {
          state.pausedForVisibility = true;
        } else {
          if (state.pausedForVisibility) {
            state.pausedForVisibility = false;
            state.tPrev = 0;
          }
        }
      }

      window.addEventListener("resize", () => setCanvasSize());
      canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
      window.addEventListener("keydown", onKeyDown);
      document.addEventListener("visibilitychange", onVisibility);

      setCanvasSize();
      loadBest();
      resetGame(true);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
